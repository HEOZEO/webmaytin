<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Debug</title>
  <style>
    body { background:#0f172a; color:white; font-family:sans-serif; padding:20px; }
    .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-top:20px; }
    .card { background:#1e293b; padding:12px; border-radius:12px; }
    .img-box { width:100%; aspect-ratio:16/9; background:#020617; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
    .img-box img { width:100%; height:100%; object-fit:cover; }
    .img-box.contain img { object-fit:contain; padding:8px; }
    h3 { font-size:13px; margin:0; }
  </style>
</head>
<body>
  <h1>Image Debug Page</h1>
  <p>Nếu thấy ảnh laptop bên dưới thì backend + URL hoàn toàn OK. Nếu không thấy thì do network/cors.</p>
  <div class="grid" id="grid"></div>
  <script>
    const products = [
      { id:1, name:'Dell Inspiron 3520', url:'/images/products/Dell_Inspiron_3520.webp' },
      { id:13, name:'MacBook Air M1 2020', url:'/images/products/MacBook_Air_M1_2020.jpg' },
      { id:14, name:'MacBook Air M2 2022', url:'/images/products/MacBook_Air_M2_2022.jpg' },
      { id:15, name:'MacBook Pro 13" M2', url:'/images/products/MacBook_Pro_13_M2.jpg' },
      { id:17, name:'Asus VivoBook 15', url:'/images/products/Asus_VivoBook_15_X515.jpg' },
    ];
    const grid = document.getElementById('grid');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-box"><img src="${p.url}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span style=color:red>FAIL ${p.url}</span>'" /></div>
        <h3>${p.name}</h3>
        <p style="font-size:10px;color:#64748b">${p.url}</p>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
